<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Clip - Instant Code Share</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      overflow: hidden;
    }

    #app { display: flex; flex-direction: column; height: 100vh; }
    
    #home-screen { 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      flex: 1;
      text-align: center;
      padding: 40px;
    }
    
    #room-screen { 
      display: none;
      flex-direction: column; 
      flex: 1;
    }
    
    #room-screen.active { display: flex; }
    #home-screen.hidden { display: none; }

    .logo { font-size: 4rem; color: #60a5fa; font-weight: 900; margin-bottom: 10px; }
    .tagline { font-size: 1.2rem; color: #94a3b8; margin-bottom: 50px; }
    .btn-group { display: flex; flex-direction: column; gap: 15px; align-items: center; }
    
    .big-btn {
      width: 300px;
      padding: 16px;
      font-size: 1.1rem;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .big-btn:hover { background: #2563eb; transform: translateY(-2px); }
    .big-btn:active { transform: translateY(0); }
    
    #btn-join { width: auto; padding: 14px 20px; }
    .divider { margin: 20px 0; color: #64748b; font-size: 0.95rem; }
    .input-group { display: flex; gap: 10px; }
    
    #room-input {
      width: 250px;
      padding: 14px;
      font-size: 1rem;
      background: #1e2937;
      border: 2px solid #334155;
      color: white;
      border-radius: 8px;
    }
    #room-input:focus { outline: none; border-color: #60a5fa; }

    header {
      background: #1e2937;
      border-bottom: 2px solid #334155;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-center { display: flex; align-items: center; gap: 8px; }
    .header-right { display: flex; align-items: center; gap: 8px; }

    .status-dot {
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    #room-id { 
      font-weight: bold; 
      color: #60a5fa; 
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
    }

    /* HOST/GUEST BADGE */
    .user-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
    }
    .user-badge.host {
      background: #f59e0b;
      color: #000;
    }
    .user-badge.guest {
      background: #60a5fa;
      color: #fff;
    }

    #btn-copy { padding: 6px 10px; font-size: 0.85rem; }

    .timer-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .timer-label input { cursor: pointer; width: 16px; height: 16px; }

    .timer-section { display: flex; align-items: center; gap: 8px; }

    .timer-btn {
      background: #334155;
      color: white;
      border: 2px solid #475569;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      padding: 0;
      user-select: none;
    }
    .timer-btn:hover { background: #475569; border-color: #60a5fa; }
    .timer-btn:active { background: #60a5fa; }

    #timer-value { min-width: 20px; text-align: center; font-weight: bold; }

    #timer-countdown {
      font-family: 'Courier New', monospace;
      font-weight: bold;
      color: #fbbf24;
      min-width: 45px;
      text-align: center;
    }

    button {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #334155;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.15s;
    }
    button:hover { background: #475569; }
    button:active { transform: scale(0.95); }

    /* Live Share button - green when active */
    #btn-live-share.active {
      background: #22c55e;
      color: white;
    }
    #btn-live-share.active:hover {
      background: #16a34a;
    }

    #btn-send { background: #3b82f6; }
    #btn-send:hover { background: #2563eb; }
    #btn-send.sent { background: #22c55e; }

    #btn-privacy { background: #8b5cf6; }
    #btn-privacy:hover { background: #7c3aed; }
    #btn-privacy.active { background: #ec4899; }

    #btn-leave { background: #ef4444; }
    #btn-leave:hover { background: #dc2626; }

    .main-content { display: flex; flex: 1; overflow: hidden; }

    .sidebar {
      width: 260px;
      background: #1e2937;
      border-right: 2px solid #334155;
      padding: 15px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    .sidebar h3 { margin-bottom: 12px; font-size: 1rem; color: #94a3b8; }

    .drop-zone {
      border: 3px dashed #64748b;
      border-radius: 10px;
      padding: 30px 15px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 15px;
      transition: all 0.2s;
      background: rgba(100, 116, 139, 0.05);
    }
    .drop-zone:hover { border-color: #60a5fa; background: rgba(96, 165, 250, 0.1); }
    .drop-zone.dragover { border-color: #60a5fa; background: rgba(96, 165, 250, 0.15); }

    .file-list { flex: 1; overflow-y: auto; }

    .file-item {
      padding: 10px 12px;
      margin: 5px 0;
      background: #334155;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.15s;
      word-break: break-word;
    }
    .file-item:hover { background: #475569; }
    .file-item.active { background: #60a5fa; color: white; }
    .file-name { flex: 1; }
    .file-delete { color: #ef4444; cursor: pointer; margin-left: 8px; user-select: none; }

    .editor-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1e2937;
    }

    .editor-header {
      background: #1e2937;
      border-bottom: 1px solid #334155;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #current-file {
      font-weight: bold;
      color: #60a5fa;
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
    }

    #editor {
      flex: 1;
      background: #1e2937;
      color: #e2e8f0;
      border: none;
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
    }
    #editor:focus { outline: none; box-shadow: inset 0 0 8px rgba(96, 165, 250, 0.1); }
    #editor.privacy { color: transparent; text-shadow: 0 0 8px rgba(96, 165, 250, 0.5); }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: #22c55e;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      animation: slideIn 0.3s ease;
      z-index: 1000;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    /* Connection status indicator */
    .connection-status {
      position: fixed;
      bottom: 10px;
      right: 10px;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .connection-status.connected {
      background: #22c55e;
      color: white;
    }
    .connection-status.disconnected {
      background: #ef4444;
      color: white;
    }

    @media (max-width: 768px) {
      .sidebar { width: 200px; }
      header { flex-direction: column; align-items: flex-start; }
      .big-btn { width: 280px; }
      #room-input { width: 200px; }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- HOME SCREEN -->
  <div id="home-screen">
    <div class="logo">📋</div>
    <h1 style="font-size: 2.5rem; margin-bottom: 10px;">Quick Clip</h1>
    <p class="tagline">Share code & text instantly. Auto-deletes after timer.</p>
    
    <div class="btn-group">
      <button class="big-btn" id="btn-create">Create New Room</button>
      <div class="divider">— OR —</div>
      <div class="input-group">
        <input type="text" id="room-input" placeholder="Enter room code">
        <button class="big-btn" id="btn-join">Join</button>
      </div>
    </div>
  </div>

  <!-- ROOM SCREEN -->
  <div id="room-screen">
    <header>
      <div class="header-left">
        <div class="status-dot"></div>
        <span>Room:</span>
        <span id="room-id">qc-XXXXX</span>
        <span id="user-badge" class="user-badge host">Host</span>
        <button id="btn-copy">📋 Copy</button>
      </div>

      <div class="header-center">
        <label class="timer-label">
          <input type="checkbox" id="timer-toggle" checked>
          <span>Auto-delete</span>
        </label>
        <div class="timer-section">
          <button id="btn-timer-minus" class="timer-btn">−</button>
          <span id="timer-value">1</span>
          <span>min</span>
          <button id="btn-timer-plus" class="timer-btn">+</button>
          <span id="timer-countdown">—</span>
        </div>
      </div>

      <div class="header-right">
        <button id="btn-privacy">🔒 Privacy</button>
        <button id="btn-format">🎨 Format</button>
        <button id="btn-live-share">📡 Live Share</button>
        <button id="btn-send">✈️ Send</button>
        <button id="btn-leave">Leave</button>
      </div>
    </header>

    <div class="main-content">
      <div class="sidebar">
        <h3>📁 Files</h3>
        <div id="drop-zone" class="drop-zone">
          <strong>Drag & drop</strong><br>
          or click to select<br>
          <small>.txt .js .py .html</small>
        </div>
        <input type="file" id="file-input" hidden accept=".txt,.js,.py,.html,.css,.json,.md">
        <div class="file-list" id="file-list"></div>
      </div>

      <div class="editor-container">
        <div class="editor-header">
          <span id="current-file">welcome.txt</span>
        </div>
        <textarea id="editor" placeholder="Your code or text here..."></textarea>
      </div>
    </div>
  </div>
</div>

<!-- Connection status indicator -->
<div id="connection-status" class="connection-status disconnected">Disconnected</div>

<script>
  // ============ GLOBAL STATE ============
  let socket = null;
  let currentRoomId = null;
  let isHost = false;
  let appState = {
    files: [{ name: "welcome.txt", content: "Welcome to Quick Clip!\n\nStart typing or paste code here." }],
    currentFileIndex: 0,
    timerMinutes: 1,
    timerInterval: null,
    isTimerEnabled: true,
    isPrivacyMode: false,
    isLiveShareEnabled: false
  };

  // ============ NOTIFICATION ============
  function showNotification(message, type = 'success') {
    const notif = document.createElement('div');
    notif.className = 'notification';
    notif.textContent = message;
    notif.style.background = type === 'error' ? '#ef4444' : '#22c55e';
    document.body.appendChild(notif);
    setTimeout(() => notif.remove(), 3000);
  }

  // ============ CONNECTION STATUS ============
  function updateConnectionStatus(connected) {
    const statusEl = document.getElementById('connection-status');
    if (connected) {
      statusEl.textContent = 'Connected';
      statusEl.className = 'connection-status connected';
    } else {
      statusEl.textContent = 'Disconnected';
      statusEl.className = 'connection-status disconnected';
    }
  }

  // ============ USER BADGE ============
  function setUserBadge(isHostUser) {
    isHost = isHostUser;
    const badge = document.getElementById('user-badge');
    if (isHost) {
      badge.textContent = 'Host';
      badge.className = 'user-badge host';
    } else {
      badge.textContent = 'Guest';
      badge.className = 'user-badge guest';
    }
  }

  // ============ SOCKET.IO SETUP ============
  function initSocket() {
    if (socket) return;
    
    console.log('Initializing socket...');
    socket = io({ transports: ['websocket', 'polling'] });

    socket.on('connect', () => {
      console.log('Connected to server, socket ID:', socket.id);
      updateConnectionStatus(true);
    });

    socket.on('connect_error', (err) => {
      console.error('Connection error:', err.message);
      updateConnectionStatus(false);
    });

    socket.on('disconnect', () => {
      console.log('Disconnected from server');
      updateConnectionStatus(false);
    });

    // Room data on join
    socket.on('roomData', (data) => {
      console.log('Room data received:', data);
      if (data.files && data.files.length > 0) {
        appState.files = data.files;
        renderFileList();
        loadCurrentFile();
        showNotification('Room files loaded');
      }
    });

    // File list updates
    socket.on('fileListUpdate', (files) => {
      console.log('File list updated:', files);
      appState.files = files;
      renderFileList();
      loadCurrentFile();
    });

    // Live share - real-time typing
    socket.on('editorUpdate', (data) => {
      console.log('Live update received:', data);
      if (appState.files[data.fileIndex]) {
        appState.files[data.fileIndex].content = data.content;
        if (data.fileIndex === appState.currentFileIndex) {
          document.getElementById('editor').value = data.content;
        }
      }
    });

    // ============ FIXED: Content Received Handler ============
    socket.on('contentReceived', (data) => {
      console.log('========== CONTENT RECEIVED ==========');
      console.log('Full data:', data);
      console.log('data.file:', data.file);
      console.log('data.file.name:', data.file ? data.file.name : 'undefined');
      console.log('data.file.content:', data.file ? data.file.content : 'undefined');
      
      // Validate data
      if (!data || !data.file) {
        console.error('Invalid data received - missing file');
        showNotification('Error: Invalid data received', 'error');
        return;
      }
      
      const receivedFile = data.file;
      const fileName = receivedFile.name || 'received.txt';
      const fileContent = receivedFile.content || '';
      
      console.log('Processing file:', fileName);
      console.log('Content length:', fileContent.length);
      
      // Create new file object
      const newFile = {
        name: fileName,
        content: fileContent
      };
      
      // Check if file with same name exists
      const existingIndex = appState.files.findIndex(f => f.name === fileName);
      if (existingIndex !== -1) {
        // Update existing file
        console.log('Updating existing file at index:', existingIndex);
        appState.files[existingIndex].content = fileContent;
        appState.currentFileIndex = existingIndex;
      } else {
        // Add new file
        console.log('Adding new file');
        appState.files.push(newFile);
        appState.currentFileIndex = appState.files.length - 1;
      }
      
      // Update UI
      renderFileList();
      loadCurrentFile();
      
      showNotification('Received: ' + fileName);
      console.log('========== CONTENT DISPLAYED ==========');
    });

    socket.on('contentDeleted', (data) => {
      alert(data.message);
    });

    socket.on('userJoined', (data) => {
      console.log('User joined:', data);
      showNotification('User joined (' + data.userCount + ' total)');
    });

    socket.on('userLeft', (data) => {
      console.log('User left:', data);
      showNotification('User left (' + data.userCount + ' remaining)');
    });

    socket.on('error', (err) => {
      console.error('Socket error:', err);
      showNotification('Error: ' + err, 'error');
    });
  }

  // ============ UI FUNCTIONS ============
  function showRoom() {
    document.getElementById('home-screen').classList.add('hidden');
    document.getElementById('room-screen').classList.add('active');
  }

  function showHome() {
    document.getElementById('home-screen').classList.remove('hidden');
    document.getElementById('room-screen').classList.remove('active');
  }

  function loadCurrentFile() {
    const file = appState.files[appState.currentFileIndex];
    if (file) {
      document.getElementById('editor').value = file.content;
      document.getElementById('current-file').textContent = file.name;
      console.log('Loaded file:', file.name, 'Content length:', file.content.length);
    }
  }

  function renderFileList() {
    const list = document.getElementById('file-list');
    list.innerHTML = '';

    appState.files.forEach((file, i) => {
      const div = document.createElement('div');
      div.className = 'file-item';
      if (i === appState.currentFileIndex) div.classList.add('active');

      const nameSpan = document.createElement('span');
      nameSpan.className = 'file-name';
      nameSpan.textContent = file.name;
      nameSpan.onclick = () => {
        appState.currentFileIndex = i;
        loadCurrentFile();
        renderFileList();
      };

      const deleteSpan = document.createElement('span');
      deleteSpan.className = 'file-delete';
      deleteSpan.textContent = '✕';
      deleteSpan.onclick = (e) => {
        e.stopPropagation();
        if (confirm('Delete "' + file.name + '"?')) {
          appState.files.splice(i, 1);
          if (appState.currentFileIndex >= appState.files.length) {
            appState.currentFileIndex = Math.max(0, appState.files.length - 1);
          }
          renderFileList();
          loadCurrentFile();
          if (socket && currentRoomId) {
            socket.emit('deleteFile', { roomId: currentRoomId, fileIndex: i });
          }
        }
      };

      div.appendChild(nameSpan);
      div.appendChild(deleteSpan);
      list.appendChild(div);
    });
  }

  // ============ ENTER ROOM ============
  function enterRoom(roomId, asHost) {
    // Normalize room ID to lowercase for case-insensitive matching
    currentRoomId = roomId.toLowerCase();
    document.getElementById('room-id').textContent = currentRoomId;
    setUserBadge(asHost);
    
    initSocket();
    
    const tryJoin = () => {
      if (socket && socket.connected) {
        console.log('Emitting joinRoom for:', roomId);
        socket.emit('joinRoom', roomId);
        showNotification(asHost ? 'Room created!' : 'Joined room!');
      } else {
        console.log('Waiting for connection...');
        setTimeout(tryJoin, 100);
      }
    };
    tryJoin();
    
    showRoom();
  }

  // ============ FILE UPLOAD ============
  function handleFileUpload(file) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const newFile = { name: file.name, content: ev.target.result };
      appState.files.push(newFile);
      appState.currentFileIndex = appState.files.length - 1;
      
      if (socket && currentRoomId) {
        socket.emit('addFile', { roomId: currentRoomId, file: newFile });
      }

      renderFileList();
      loadCurrentFile();
      showNotification('Uploaded: ' + file.name);
    };
    reader.onerror = () => {
      showNotification('Error reading file', 'error');
    };
    reader.readAsText(file);
  }

  // ============ TIMER ============
  function startTimer(minutes) {
    let seconds = minutes * 60;
    clearInterval(appState.timerInterval);
    
    appState.timerInterval = setInterval(() => {
      if (seconds > 0) {
        seconds--;
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        document.getElementById('timer-countdown').textContent = m + ':' + (s < 10 ? '0' : '') + s;
      } else {
        document.getElementById('timer-countdown').textContent = '0:00';
        clearInterval(appState.timerInterval);
        alert('Timer expired!');
      }
    }, 1000);
  }

  // ============ INITIALIZE ============
  document.addEventListener('DOMContentLoaded', () => {
    // HOME BUTTONS
    document.getElementById('btn-create').onclick = () => {
      const roomId = 'qc-' + Math.random().toString(36).substring(2, 8).toLowerCase();
      enterRoom(roomId, true);
    };

    document.getElementById('btn-join').onclick = () => {
      let code = document.getElementById('room-input').value.trim().toLowerCase();
      if (!code) {
        alert('Please enter a room code');
        return;
      }
      if (!code.startsWith('qc-')) code = 'qc-' + code;
      enterRoom(code, false);
    };

    document.getElementById('room-input').onkeypress = (e) => {
      if (e.key === 'Enter') document.getElementById('btn-join').click();
    };

    // COPY BUTTON
    document.getElementById('btn-copy').onclick = () => {
      navigator.clipboard.writeText(currentRoomId).then(() => {
        const btn = document.getElementById('btn-copy');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 2000);
      });
    };

    // PRIVACY BUTTON
    document.getElementById('btn-privacy').onclick = () => {
      appState.isPrivacyMode = !appState.isPrivacyMode;
      document.getElementById('editor').classList.toggle('privacy');
      const btn = document.getElementById('btn-privacy');
      btn.classList.toggle('active');
      btn.textContent = appState.isPrivacyMode ? 'Privacy Off' : 'Privacy';
    };

    // FORMAT BUTTON
    document.getElementById('btn-format').onclick = () => {
      const editor = document.getElementById('editor');
      let text = editor.value.split('\n').map(l => l.trim()).filter(l => l).join('\n\n');
      editor.value = text;
      if (appState.files[appState.currentFileIndex]) {
        appState.files[appState.currentFileIndex].content = text;
      }
    };

    // LIVE SHARE BUTTON
    document.getElementById('btn-live-share').onclick = () => {
      appState.isLiveShareEnabled = !appState.isLiveShareEnabled;
      const btn = document.getElementById('btn-live-share');
      
      if (appState.isLiveShareEnabled) {
        // Turn ON - green background
        btn.classList.add('active');
        btn.textContent = '📡 Live Share ON';
        showNotification('Live Share ON - Others see your typing!');
      } else {
        // Turn OFF - normal color
        btn.classList.remove('active');
        btn.textContent = '📡 Live Share';
        showNotification('Live Share OFF');
      }
    };

    // SEND BUTTON
    document.getElementById('btn-send').onclick = () => {
      const content = appState.files[appState.currentFileIndex]?.content;
      if (!content || !content.trim()) {
        alert('Cannot send empty content!');
        return;
      }

      console.log('Sending content...', { roomId: currentRoomId, file: appState.files[appState.currentFileIndex] });

      const btn = document.getElementById('btn-send');
      btn.classList.add('sent');
      btn.textContent = 'Sent';
      btn.disabled = true;

      if (socket && currentRoomId) {
        socket.emit('sendContent', {
          roomId: currentRoomId,
          file: appState.files[appState.currentFileIndex],
          timerEnabled: appState.isTimerEnabled,
          timerMinutes: appState.timerMinutes
        });
        console.log('Content emitted to server');
      } else {
        console.error('Cannot send - socket or roomId missing');
        showNotification('Not connected!', 'error');
      }

      if (appState.isTimerEnabled) {
        startTimer(appState.timerMinutes);
      }

      setTimeout(() => {
        btn.classList.remove('sent');
        btn.textContent = 'Send';
        btn.disabled = false;
      }, 3000);
    };

    // LEAVE BUTTON
    document.getElementById('btn-leave').onclick = () => {
      if (confirm('Leave this room?')) {
        if (socket && currentRoomId) {
          socket.emit('leaveRoom', currentRoomId);
        }
        clearInterval(appState.timerInterval);
        appState.files = [{ name: "welcome.txt", content: "Welcome to Quick Clip!\n\nStart typing or paste code here." }];
        appState.currentFileIndex = 0;
        currentRoomId = null;
        showHome();
      }
    };

    // TIMER BUTTONS
    let minusInterval, plusInterval;
    document.getElementById('btn-timer-minus').onmousedown = () => {
      appState.timerMinutes = Math.max(1, appState.timerMinutes - 1);
      document.getElementById('timer-value').textContent = appState.timerMinutes;
      minusInterval = setInterval(() => {
        appState.timerMinutes = Math.max(1, appState.timerMinutes - 1);
        document.getElementById('timer-value').textContent = appState.timerMinutes;
      }, 150);
    };
    document.getElementById('btn-timer-minus').onmouseup = () => clearInterval(minusInterval);
    document.getElementById('btn-timer-minus').onmouseleave = () => clearInterval(minusInterval);

    document.getElementById('btn-timer-plus').onmousedown = () => {
      appState.timerMinutes = Math.min(60, appState.timerMinutes + 1);
      document.getElementById('timer-value').textContent = appState.timerMinutes;
      plusInterval = setInterval(() => {
        appState.timerMinutes = Math.min(60, appState.timerMinutes + 1);
        document.getElementById('timer-value').textContent = appState.timerMinutes;
      }, 150);
    };
    document.getElementById('btn-timer-plus').onmouseup = () => clearInterval(plusInterval);
    document.getElementById('btn-timer-plus').onmouseleave = () => clearInterval(plusInterval);

    document.getElementById('timer-toggle').onchange = (e) => {
      appState.isTimerEnabled = e.target.checked;
      document.querySelector('.timer-section').style.opacity = appState.isTimerEnabled ? '1' : '0.3';
    };

    // EDITOR - LIVE SHARE
    document.getElementById('editor').oninput = () => {
      if (appState.files[appState.currentFileIndex]) {
        appState.files[appState.currentFileIndex].content = document.getElementById('editor').value;
        
        if (appState.isLiveShareEnabled && socket && currentRoomId) {
          socket.emit('editorUpdate', {
            roomId: currentRoomId,
            content: document.getElementById('editor').value,
            fileIndex: appState.currentFileIndex
          });
        }
      }
    };

    // FILE UPLOAD
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    dropZone.ondragover = (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    };
    dropZone.ondragleave = () => dropZone.classList.remove('dragover');
    dropZone.ondrop = (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        handleFileUpload(e.dataTransfer.files[0]);
      }
    };
    dropZone.onclick = () => fileInput.click();

    fileInput.onchange = (e) => {
      if (e.target.files.length > 0) {
        handleFileUpload(e.target.files[0]);
      }
    };

    // INIT
    renderFileList();
    loadCurrentFile();
  });
</script>

</body>
</html>
